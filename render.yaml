services:
  - type: web
    name: sitespeak-voice-agent
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PORT
        value: 8787
      - key: NODE_ENV
        value: production
